<!DOCTYPE html>
<html>
<head>
  <title>Flood Safe Roads - Chennai</title>
  <!-- Leaflet: the free library that draws the map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { margin: 0; }
    #map { height: 100vh; }  /* make the map fill the whole screen */
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    // 1. Create the map and point it at Chennai (latitude, longitude), zoom level 11
    const map = L.map('map').setView([13.0827, 80.2707], 11);

    // 2. Load the actual map pictures from OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 3. Colors for each severity level
    const colors = { severe: 'red', waterlogged: 'orange' };

    // 4. Load the flood data file, then draw it on the map
    fetch('data/flood-2023.geojson')
    .then(response => response.json())
    .then(data => {
      L.geoJSON(data, {
        // Draw each point as a fixed-size circle marker, colored by severity
        pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
          radius: 10,
          color: colors[feature.properties.severity],
          fillColor: colors[feature.properties.severity],
          fillOpacity: 0.6
        }),
        // Add a popup with the details when someone clicks a marker
        onEachFeature: (feature, layer) => {
          const p = feature.properties;
          layer.bindPopup(
            "<b>" + p.name + "</b> (" + p.severity + ")<br>" +
            p.note + "<br><small>Source: " + p.source + "</small>"
          );
        }
      }).addTo(map);
    });
    
  </script>
</body>
</html>
